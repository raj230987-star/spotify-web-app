services:
  backend:
    build: ./backend
    container_name: spotify-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/faiss_index:/app/faiss_index
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: spotify-rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge